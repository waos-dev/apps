# Collects each listed app's latest package into R2 and writes the catalog's index.json there
# (collect.py): every hour, on a change to the catalog or the script, and by hand. When nothing is
# new, it stops after reading the sources, before installing waos.
#
# Secrets: CLOUDFLARE_API_TOKEN (R2 write) and CLOUDFLARE_ACCOUNT_ID.
name: Collect

on:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]
    paths: [catalog.toml, collect.py]
  workflow_dispatch:

# One run at a time, so two never write the index together: a run started while one is going
# waits for it.
concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: read

env:
  # The waos that verifies each package: waos-dev/waos at this commit.
  WAOS_REV: 849efff82b85d84d3066ce13131901808d016eec

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Anything new?
        id: check
        run: python3 collect.py --check

      - name: waos, from the cache
        if: steps.check.outputs.changed == 'true'
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: ~/waos-cli
          key: waos-cli-${{ runner.os }}-${{ env.WAOS_REV }}

      - name: waos, built
        if: steps.check.outputs.changed == 'true' && steps.cache.outputs.cache-hit != 'true'
        run: cargo install --git https://github.com/waos-dev/waos --rev "$WAOS_REV" waos-cli --locked --root ~/waos-cli

      - name: waos, cached for the next run
        if: steps.check.outputs.changed == 'true' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/waos-cli
          key: waos-cli-${{ runner.os }}-${{ env.WAOS_REV }}

      - name: Collect
        if: steps.check.outputs.changed == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 collect.py --waos ~/waos-cli/bin/waos
